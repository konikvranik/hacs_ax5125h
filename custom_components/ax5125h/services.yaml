send_raw:
  name: Send raw CEC frame
  description: >-
    Sends an arbitrary CEC frame through the integration transport (source
    address can be spoofed — this is how EZPlay commands are sent as the TV).
    Guard rails: subopcodes 0xA6/0xB0/0xB2 (destructive on AX5125H) and a bare
    A2 without a value are rejected.
  fields:
    entity_id:
      name: Entity
      description: Any soundbar entity (selects the config entry).
      required: false
      selector:
        entity:
          integration: ax5125h
    source:
      name: Source address
      description: Logical address of the sender (0 = TV, 5 = soundbar, 14 = gateway).
      required: true
      example: 0
      selector:
        number:
          min: 0
          max: 15
          step: 1
    destination:
      name: Destination address
      description: Logical address of the receiver (5 = soundbar, 15 = broadcast).
      required: true
      example: 5
      selector:
        number:
          min: 0
          max: 15
          step: 1
    data:
      name: Data
      description: "Opcode + payload bytes, 0x or decimal (e.g. '0xA0,0xA8,0x82,0x00,0xA0')."
      required: true
      example: "0xA0,0xA8,0x82,0x00,0xA3,0x05"
      selector:
        text:

volume_up:
  name: Volume up
  description: Volume up via CEC UCP (User Control Pressed/Released).
  fields:
    entity_id:
      name: Entity
      description: Any soundbar entity.
      required: true
      selector:
        entity:
          integration: ax5125h

volume_down:
  name: Volume down
  description: Volume down via CEC UCP.
  fields:
    entity_id:
      name: Entity
      description: Any soundbar entity.
      required: true
      selector:
        entity:
          integration: ax5125h

mute_toggle:
  name: Toggle mute
  description: Mute toggle via CEC UCP.
  fields:
    entity_id:
      name: Entity
      description: Any soundbar entity.
      required: true
      selector:
        entity:
          integration: ax5125h
